version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ratelimitr-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - ratelimitr-net

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimitr-app-1
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FAIL_MODE=fail_closed
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ratelimitr-net

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimitr-app-2
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FAIL_MODE=fail_closed
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ratelimitr-net

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimitr-app-3
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FAIL_MODE=fail_closed
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ratelimitr-net

  nginx:
    image: nginx:alpine
    container_name: ratelimitr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - ratelimitr-net

volumes:
  redis-data:

networks:
  ratelimitr-net:
    driver: bridge
